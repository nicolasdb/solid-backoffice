# Serves the static build (dist/) behind nginx-gateway, which handles TLS and
# routing. Deliberately independent of the provider stack: the app is its own
# project, and only the pod is shared with it.
#
# Rename the service, container_name and labels for each app — the container
# name is what the gateway vhost proxies to. CONTAINER and DOMAIN come from the
# .env that `make vps-push` writes beside this file, so the test copy
# (TARGET=test) runs beside production under its own name.
services:
  # Not `solid-backoffice-web`: compose also registers the service name as an
  # alias on the gateway network, and both copies would answer to it. The
  # gateway proxies to container names, which differ.
  solid-backoffice:
    image: nginx:alpine
    container_name: ${CONTAINER:-solid-backoffice-web}
    restart: unless-stopped

    networks:
      - gateway

    volumes:
      # Built locally and rsynced — nothing is compiled on the server, so there
      # is no node toolchain to maintain there. This is a bind mount, so a new
      # build is served without restarting the container.
      - ./dist:/usr/share/nginx/html:ro
      - ./deploy/nginx-site.conf:/etc/nginx/conf.d/default.conf:ro

    labels:
      app.name: "${CONTAINER:-solid-backoffice-web}"
      app.description: "Backoffice: accounts, permissions, membership"
      app.domain: "${DOMAIN:-backoffice.nicolasdb.eu}"

    healthcheck:
      # 127.0.0.1, not localhost: busybox resolves localhost to ::1 first, and
      # nginx here listens on IPv4 only, so the check failed on a healthy site.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  # Shared with nginx-gateway, which creates it.
  gateway:
    external: true
