# Inside the app's own container. Serves the static build and nothing else:
# TLS, redirection and security headers are handled upstream by nginx-gateway.
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log combined;

    # No client-side router today, but reloading an unknown URL should render
    # the app rather than an nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits hashed filenames: their contents never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached — it is what points at the hashed names,
    # and caching it makes every deploy invisible.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
