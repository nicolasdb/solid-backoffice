# Inside the app's own container. Serves the static build and nothing else:
# TLS, redirection and security headers are handled upstream by nginx-gateway.
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log combined;

    # No client-side router today, but reloading an unknown URL should render
    # the app rather than an nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # What an instance mounts or the image writes at start (solid-kit ADR 011):
    # /instance.json and /skin.css with the skin's fonts at /fonts/skin/, and
    # /id.jsonld from PUBLIC_URL. Absent, they must 404, never fall through to
    # index.html above: an HTML answer to /instance.json is a parse error, and
    # one to /id.jsonld a broken sign-in. Not cached: they change without the
    # image changing.
    location ~ ^/(instance\.json|skin\.css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    # The provider reads it as JSON-LD by its Content-Type; nginx's mime.types
    # has no .jsonld, and octet-stream would fail the sign-in.
    location = /id.jsonld {
        types { }
        default_type application/ld+json;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location /fonts/skin/ {
        try_files $uri =404;
    }

    # Vite emits hashed filenames: their contents never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached — it is what points at the hashed names,
    # and caching it makes every deploy invisible.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
